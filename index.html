<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="ias.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi página web</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .caja {
            width: 100%;
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            font-size: 24px;
        }

        .encabezado {
            height: 150px;
            background-color: #b8f0dd;
        }

        .acerca {
            height: 350px;
            background-color: #b8f0dd;
        }

        .proyectos {
            height: 350px;
            background-color: #b8f0dd;
        }
    </style>
</head>

<body>

    <div class="caja encabezado">
        Encabezado
    </div>

    <div class="caja acerca">
        Acerca de mí
    </div>

    <div class="caja proyectos">
        Proyectos
    </div>

</body>
</html>
